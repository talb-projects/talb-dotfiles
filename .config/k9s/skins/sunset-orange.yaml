# -----------------------------------------------------------------------------
# Sunset Orange
# Matches the yazi flavor sunset-orange.yazi. All colours are exact xterm-256 values.
# -----------------------------------------------------------------------------
bg: &bg "#303030"
panel: &panel "#262626"
fg: &fg "#ffd7af"
muted: &muted "#808080"
border: &border "#6c6c6c"
selection: &selection "#585858"
darkborder: &darkborder "#585858"
dark: &dark "#1c1c1c"
gold: &gold "#ffd700"
amber: &amber "#ffaf00"
primary: &primary "#ffaf5f"   # main text: soft orange
light: &light "#bcbcbc"
ember: &ember "#ff5f00"
red: &red "#ff0000"
orange: &orange "#ff8700"

k9s:
  body:
    fgColor: *primary
    bgColor: *bg
    logoColor: *gold
  prompt:
    fgColor: *primary
    bgColor: *bg
    suggestColor: *muted
    border:
      command: *gold
      default: *border
  info:
    fgColor: *amber
    sectionColor: *light
  dialog:
    fgColor: *primary
    bgColor: *bg
    buttonFgColor: *dark
    buttonBgColor: *amber
    buttonFocusFgColor: *dark
    buttonFocusBgColor: *gold
    labelFgColor: *gold
    fieldFgColor: *primary
  frame:
    border:
      fgColor: *border
      focusColor: *darkborder
    menu:
      fgColor: *light
      fgStyle: normal
      keyColor: *gold
      numKeyColor: *amber
    crumbs:
      fgColor: *dark
      bgColor: *amber
      activeColor: *gold
    status:
      newColor: *primary   # k9s uses newColor for normal table rows
      modifyColor: *ember
      addColor: *gold
      errorColor: *red
      highlightColor: *gold
      killColor: *muted
      completedColor: *muted
    title:
      fgColor: *amber
      bgColor: *bg
      highlightColor: *gold
      counterColor: *gold
      filterColor: *gold
  views:
    charts:
      bgColor: default
      defaultDialColors:
        - *gold
        - *red
      defaultChartColors:
        - *gold
        - *red
    table:
      fgColor: *primary
      bgColor: *bg
      cursorFgColor: *dark
      cursorBgColor: *gold
      markColor: *selection
      header:
        fgColor: *amber
        bgColor: *bg
        sorterColor: *gold
    xray:
      fgColor: *primary
      bgColor: *bg
      cursorColor: *gold
      cursorTextColor: *dark
      graphicColor: *border
      showIcons: false
    yaml:
      keyColor: *gold
      colonColor: *muted
      valueColor: *primary
    logs:
      fgColor: *primary
      bgColor: *bg
      indicator:
        fgColor: *amber
        bgColor: *panel
        toggleOnColor: *gold
        toggleOffColor: *muted
