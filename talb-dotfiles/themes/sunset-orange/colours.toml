# Sunset Orange palette - reference for the colours used across .config/.
# Every colour is an exact xterm-256 value (hex for k9s/yazi/nvim, xterm index for
# dircolors/git/less as 38;5;<xterm>). Nothing reads this file automatically:
# when you change a colour here, update the matching files listed in [files].

name = "sunset-orange"
title = "Sunset Orange"

# ---------------------------------------------------------------------------
# Greys (background -> foreground)
# ---------------------------------------------------------------------------
[greys]
GREY_900 = { hex = "#1c1c1c", xterm = 234, use = "status bars, darkest, text on gold" }
GREY_800 = { hex = "#262626", xterm = 235, use = "gutters, panels" }
BG       = { hex = "#303030", xterm = 236, use = "background" }
GREY_700 = { hex = "#4e4e4e", xterm = 239, use = "cursor line" }
GREY_600 = { hex = "#585858", xterm = 240, use = "selection, k9s focused border" }
GREY_500 = { hex = "#6c6c6c", xterm = 242, use = "borders" }
GREY_400 = { hex = "#808080", xterm = 244, use = "comments, muted" }
GREY_200 = { hex = "#bcbcbc", xterm = 250, use = "secondary text, k9s menu and info values" }
GREY_100 = { hex = "#eeeeee", xterm = 255, use = "brightest text" }

# ---------------------------------------------------------------------------
# Warm gradient: gold -> orange -> red
# ---------------------------------------------------------------------------
[gradient]
GOLD   = { hex = "#ffd700", xterm = 220, use = "highlights, accents, success / added" }
AMBER  = { hex = "#ffaf00", xterm = 214, use = "warning, headers, executables" }
ORANGE = { hex = "#ff8700", xterm = 208, use = "primary in nvim / ls / git / less" }
EMBER  = { hex = "#ff5f00", xterm = 202, use = "modified, archives" }
RED    = { hex = "#ff0000", xterm = 196, use = "error / removed" }

# ---------------------------------------------------------------------------
# Lighter and darker shades
# ---------------------------------------------------------------------------
[shades]
FG         = { hex = "#ffd7af", xterm = 223, use = "foreground (nvim, ANSI bright cyan)" }
LIGHT_GOLD = { hex = "#ffd75f", xterm = 221, use = "documents" }
APRICOT    = { hex = "#ffaf5f", xterm = 215, use = "primary text in k9s and yazi" }
CORAL      = { hex = "#ff875f", xterm = 209, use = "media" }
LIGHT_RED  = { hex = "#ff5f5f", xterm = 203, use = "ANSI bright red" }
BURNT      = { hex = "#d75f00", xterm = 166, use = "ANSI cyan" }
RUST       = { hex = "#af5f00", xterm = 130, use = "spare dark accent (currently unused)" }
CRIMSON    = { hex = "#d70000", xterm = 160, use = "ANSI red" }

# ---------------------------------------------------------------------------
# Semantic roles -> palette names
# ---------------------------------------------------------------------------
[roles]
background     = "BG"
primary        = "ORANGE"    # nvim, ls, git, less
primary_soft   = "APRICOT"   # k9s and yazi main text
highlight      = "GOLD"      # cursor bar, keys, accents
secondary_text = "GREY_200"
muted          = "GREY_400"
border         = "GREY_500"
success        = "GOLD"
warning        = "AMBER"
modified       = "EMBER"
error          = "RED"

# ANSI-16 mapping used by nvim's embedded terminal (no greens or blues).
[ansi]
normal = ["GREY_900", "CRIMSON", "AMBER", "GOLD", "ORANGE", "EMBER", "BURNT", "GREY_200"]
bright = ["GREY_400", "LIGHT_RED", "LIGHT_GOLD", "GOLD", "APRICOT", "CORAL", "FG", "GREY_100"]

# Files under .config/ that use these colours.
[files]
k9s       = ".config/k9s/skins/sunset-orange.yaml"
yazi      = ".config/yazi/flavors/sunset-orange.yazi/flavor.toml"
yazi_code = ".config/yazi/flavors/sunset-orange.yazi/tmtheme.xml"
nvim      = ".config/nvim/colors/sunset-orange.vim"
dircolors = ".config/dircolors/dircolors"
git       = ".config/git/sunset-orange.gitconfig"
less      = ".config/less/sunset-orange.sh"
